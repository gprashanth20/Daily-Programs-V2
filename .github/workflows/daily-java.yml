name: Daily Java Check-in

on:
  schedule:
    # 09:00 IST = 03:30 UTC. Adjust as you like.
    - cron: "30 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write   # required so the workflow can push commits

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate today's programs
        run: python3 scripts/generate_daily.py

      - name: Commit and push
        run: |
          git config user.name "daily-java-bot"
          git config user.email "daily-java-bot@users.noreply.github.com"
          git add programs/ queue.json history.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          FILES=$(cat .last_run_files.txt 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          git commit -m "Daily check-in: ${FILES}"
          git push
